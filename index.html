<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Générateur de bloc dossier - GitHub Pages</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Open Sans',sans-serif;background:#f4f6fb;margin:0;padding:28px;color:#0b1a2b}
    .wrap{max-width:800px;margin:0 auto}
    h1{font-size:20px;margin-bottom:16px}
    textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-bottom:10px;box-sizing: border-box; font-family: inherit; font-size: 14px;}
    button{background:#0d346d;color:#fff;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;margin-top:10px;transition: background 0.3s;font-weight: 600;}
    button:hover{background:#16468e;}
    button:disabled{opacity: 0.6; cursor: not-allowed;}
    .output{margin-top:20px;background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    .loader { font-size: 14px; color: #0d346d; font-style: italic; margin-top: 5px; display: none; }
    pre { background: #f8f8f8; padding: 15px; border-radius: 5px; border: 1px solid #ddd; overflow-x: auto; font-size: 12px; white-space: pre-wrap; margin-top: 20px; }
    hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Générateur de bloc HTML 2.0</h1>
    
    <p>Collez vos liens ici (un lien par ligne) :</p>
    <textarea id="input" rows="8" placeholder="https://www.exemple.fr/article-1"></textarea>
    
    <button id="generateBtn">Générer le bloc HTML</button>
    <div id="loaderStatus" class="loader">Analyse des liens en cours...</div>

    <div id="resultContainer" style="display:none;">
      <div class="output" id="outputPreview"></div>
      <hr>
      <p><strong>Code HTML à copier :</strong></p>
      <pre id="outputCode"></pre>
    </div>
  </div>

  <script>
    // Fonction pour récupérer les métadonnées via un proxy CORS
    async function fetchMetadata(url) {
      try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
        const response = await fetch(proxyUrl);
        
        if (!response.ok) throw new Error('Erreur Proxy');
        
        const data = await response.json();
        const html = data.contents;

        // On parse le HTML reçu
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        // Stratégie de récupération du titre :
        // 1. Balise Meta OpenGraph (souvent la plus propre)
        // 2. Balise Title classique
        // 3. URL par défaut
        const ogTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content');
        const twitterTitle = doc.querySelector('meta[name="twitter:title"]')?.getAttribute('content');
        const pageTitle = doc.querySelector('title')?.innerText;
        
        let finalTitle = ogTitle || twitterTitle || pageTitle || url;
        
        return {
          title: finalTitle.trim(),
          url: url
        };
      } catch (error) {
        console.error("Erreur pour l'URL : " + url, error);
        // Si tout échoue, on retourne l'URL sans le protocole pour que ce soit lisible
        const fallback = url.replace(/^https?:\/\//, '').replace('www.', '');
        return { title: fallback, url: url };
      }
    }

    function buildHTML(items) {
      const styleTag = `<style>.dossier-link:hover { text-decoration: underline !important; }</style>`;
      const divStyle = "font-family: 'Open Sans', sans-serif; font-size: 16px; line-height: 1.5; color: #000; background: #fff; padding: 16px 20px; border-radius: 8px; box-shadow: 0 4px 12px rgba(13,52,109,0.2); width: 100%; box-sizing: border-box; margin: 16px 0;";
      const titleHTML = `<div style="font-weight:bold; font-size:18px; margin-bottom:12px;">Notre dossier</div>`;
      
      const rows = items.map(it => `
        <div style="margin:6px 0;">
          <span style="color: #000;">► </span>
          <a href="${it.url}" 
             target="_blank" 
             class="dossier-link" 
             style="color:#0000FF; text-decoration:none; cursor:pointer;">${it.title}</a>
        </div>`).join('');

      return `${styleTag}<div style="${divStyle}">${titleHTML}${rows}</div>`;
    }

    document.getElementById('generateBtn').addEventListener('click', async () => {
      const inputArea = document.getElementById('input');
      const btn = document.getElementById('generateBtn');
      const loader = document.getElementById('loaderStatus');
      const resultContainer = document.getElementById('resultContainer');
      const outputPreview = document.getElementById('outputPreview');
      const outputCode = document.getElementById('outputCode');
      
      const urls = inputArea.value.split(/\r?\n/)
                                  .map(l => l.trim())
                                  .filter(l => l.startsWith('http'));

      if (urls.length === 0) {
        alert("Veuillez coller au moins une URL valide (commençant par http).");
        return;
      }

      // UI en mode chargement
      btn.disabled = true;
      btn.innerText = "Traitement...";
      loader.style.display = "block";
      resultContainer.style.display = "none";

      const results = [];
      for (const url of urls) {
        const metadata = await fetchMetadata(url);
        results.push(metadata);
      }

      // Génération du rendu
      const finalHTML = buildHTML(results);
      outputPreview.innerHTML = finalHTML;
      outputCode.innerText = finalHTML;
      
      // Affichage des résultats
      loader.style.display = "none";
      resultContainer.style.display = "block";
      btn.disabled = false;
      btn.innerText = "Générer le bloc HTML";

      // Copie automatique
      try {
        await navigator.clipboard.writeText(finalHTML);
        alert('C\'est prêt ! Le code HTML a été copié dans votre presse-papier.');
      } catch (err) {
        console.error('Erreur lors de la copie', err);
      }
    });
  </script>
</body>
</html>
