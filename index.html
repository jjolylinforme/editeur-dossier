<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Générateur de bloc dossier - GitHub Pages</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Open Sans',sans-serif;background:#f4f6fb;margin:0;padding:28px;color:#0b1a2b}
    .wrap{max-width:800px;margin:0 auto}
    h1{font-size:20px;margin-bottom:16px}
    textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-bottom:10px;box-sizing: border-box; font-family: inherit;}
    button{background:#0d346d;color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;margin-top:10px;transition: opacity 0.3s;font-weight: 600;}
    button:disabled{opacity: 0.6; cursor: not-allowed;}
    .output{margin-top:20px;background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1); min-height: 50px;}
    .loader { font-size: 14px; color: #0d346d; font-style: italic; margin-top: 5px; display: none; }
    pre { background: #eee; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Générateur de bloc HTML</h1>
    
    <p>Collez vos liens ici (un lien par ligne)</p>
    <textarea id="input" rows="8" placeholder="https://www.exemple.fr/article-1"></textarea>
    
    <button id="generateBtn">Générer le bloc HTML</button>
    <div id="loaderStatus" class="loader">Récupération des titres en cours...</div>

    <div class="output" id="outputArea">Le rendu apparaîtra ici...</div>
  </div>

  <script>
    // Fonction robuste pour récupérer les titres
    async function fetchMetadata(url) {
      try {
        // Utilisation de Microlink avec des options de secours
        const response = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}&prerender=true`);
        
        if (!response.ok) throw new Error('Erreur API');
        
        const data = await response.json();
        
        // Vérification de plusieurs emplacements pour le titre (data.data.title ou data.title)
        let foundTitle = "";
        if (data.data && data.data.title) {
          foundTitle = data.data.title;
        } else if (data.title) {
          foundTitle = data.title;
        }

        return {
          title: foundTitle || url, // Si vide, on met l'URL
          url: url
        };
      } catch (error) {
        console.error("Erreur de récupération pour :", url, error);
        // En cas d'échec, on affiche l'URL au lieu de "Lien sans titre"
        return { title: url, url: url };
      }
    }

    function buildHTML(items) {
      const styleTag = `
<style>
  .dossier-link:hover { 
    text-decoration: underline !important; 
  }
</style>`;

      const divStyle = "font-family: 'Open Sans', sans-serif; font-size: 16px; line-height: 1.5; color: #000; background: #fff; padding: 16px 20px; border-radius: 8px; box-shadow: 0 4px 12px rgba(13,52,109,0.2); width: 100%; box-sizing: border-box; margin: 16px 0;";
      const titleHTML = `<div style="font-weight:bold; font-size:18px; margin-bottom:12px;">Notre dossier</div>`;
      
      const rows = items.map(it => `
        <div style="margin:6px 0;">
          <span style="color: #000;">► </span>
          <a href="${it.url}" 
             target="_blank" 
             class="dossier-link" 
             style="color:#0000FF; text-decoration:none; cursor:pointer;">${it.title}</a>
        </div>`).join('');

      return `${styleTag}<div style="${divStyle}">${titleHTML}${rows}</div>`;
    }

    document.getElementById('generateBtn').addEventListener('click', async () => {
      const inputArea = document.getElementById('input');
      const btn = document.getElementById('generateBtn');
      const loader = document.getElementById('loaderStatus');
      const outputArea = document.getElementById('outputArea');
      
      const urls = inputArea.value.split(/\r?\n/).map(l => l.trim()).filter(l => l.startsWith('http'));

      if (urls.length === 0) {
        alert("Veuillez coller au moins une URL valide.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Traitement...";
      loader.style.display = "block";

      const results = [];
      // On traite les URLs une par une
      for (const url of urls) {
        const metadata = await fetchMetadata(url);
        results.push(metadata);
      }

      const finalHTML = buildHTML(results);
      outputArea.innerHTML = finalHTML;

      // Optionnel : Ajoute le code source en dessous pour copier-coller facilement
      const codeDisplay = document.createElement('pre');
      codeDisplay.innerText = finalHTML;
      outputArea.appendChild(document.createElement('hr'));
      outputArea.appendChild(codeDisplay);

      // Copie dans le presse-papier
      try {
        await navigator.clipboard.writeText(finalHTML);
        alert('Bloc HTML généré et copié dans le presse-papier !');
      } catch (err) {
        alert('Bloc HTML généré (échec de la copie automatique).');
      }

      btn.disabled = false;
      btn.innerText = "Générer le bloc HTML";
      loader.style.display = "none";
    });
  </script>
</body>
</html>
