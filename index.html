<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Générateur de bloc dossier</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Open Sans', sans-serif; background: #f4f6fb; margin: 0; padding: 28px; color: #0b1a2b; }
    .wrap { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 20px; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #555; margin: 0 0 18px; }
    textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 10px; box-sizing: border-box; font-size: 13px; font-family: monospace; resize: vertical; }
    .btn-primary { background: #0d346d; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; }
    .btn-secondary { background: transparent; border: 1px solid #bbb; color: #0b1a2b; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-top: 4px; }
    .btn-secondary:hover { background: #e8edf5; }
    .status { font-size: 13px; color: #555; font-style: italic; margin-top: 8px; min-height: 18px; }
    #editorSection { display: none; margin-top: 24px; }
    .legend { font-size: 12px; color: #555; margin-bottom: 10px; display: flex; gap: 18px; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #1d9e75; }
    .dot-orange { background: #ef9f27; }
    .cols-header { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-right: 32px; margin-bottom: 4px; }
    .col-label { font-size: 12px; color: #888; }
    .row-wrap { display: flex; align-items: center; gap: 4px; margin-bottom: 7px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; }
    .pair input { padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; width: 100%; box-sizing: border-box; background: #fff; color: #0b1a2b; }
    .pair input.auto-filled { border-color: #1d9e75; background: #f0fdf8; color: #085041; }
    .pair input.needs-fill { border-color: #ef9f27; background: #fdf8ee; }
    .pair input[readonly] { opacity: 0.65; }
    .remove-btn { background: none; border: none; cursor: pointer; color: #aaa; font-size: 20px; padding: 0 4px; line-height: 1; }
    .remove-btn:hover { color: #c0392b; }
    .output-area { margin-top: 20px; background: #fff; padding: 14px 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: none; }
    .success-msg { color: #1d9e75; font-size: 13px; margin-top: 6px; display: none; }
    .dossier-link:hover { text-decoration: underline !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Générateur de bloc dossier</h1>
    <p class="subtitle">Collez vos liens (un par ligne) — les titres seront récupérés automatiquement si possible</p>
    <textarea id="urlInput" rows="8" placeholder="https://www.exemple.fr/article-1&#10;https://www.exemple.fr/article-2"></textarea>
    <div><button class="btn-primary" id="fetchBtn">Récupérer les titres</button></div>
    <div class="status" id="status"></div>
    <div id="editorSection">
      <div class="legend">
        <span><span class="dot dot-green"></span>Titre récupéré automatiquement</span>
        <span><span class="dot dot-orange"></span>À remplir manuellement</span>
      </div>
      <div class="cols-header">
        <div class="col-label">URL</div>
        <div class="col-label">Titre affiché</div>
      </div>
      <div id="rows"></div>
      <div><button class="btn-secondary" id="addBtn">+ Ajouter un lien</button></div>
      <div><button class="btn-primary" id="genBtn" style="margin-top:14px;">Générer le bloc HTML</button></div>
    </div>
    <div class="output-area" id="outputArea"></div>
    <button class="btn-secondary" id="copyBtn" style="display:none; margin-top:10px;">Copier le HTML</button>
    <div class="success-msg" id="successMsg">✓ Copié dans le presse-papiers !</div>
  </div>
  <script>
    let generatedHTML = '';
    let rowCount = 0;

    async function fetchTitle(url) {
      const proxies = [
        async () => {
          const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
          const d = await r.json();
          const m = d.contents && d.contents.match(/<title[^>]*>([^<]+)<\/title>/i);
          return m ? decodeEntities(m[1].trim()) : null;
        },
        async () => {
          const r = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
          const html = await r.text();
          const m = html.match(/<title[^>]*>([^<]+)<\/title>/i);
          return m ? decodeEntities(m[1].trim()) : null;
        }
      ];
      for (const p of proxies) {
        try { const t = await p(); if (t && t.length > 2) return t; } catch(e) {}
      }
      return null;
    }

    function decodeEntities(str) {
      return str.replace(/&amp;/g,'&').replace(/&#039;/g,"'").replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
    }

    function escapeAttr(str) {
      return str.replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function addRow(url, title, autoFilled) {
      url = url || ''; title = title || ''; autoFilled = !!autoFilled;
      rowCount++;
      const id = rowCount;
      const div = document.createElement('div');
      div.className = 'row-wrap';
      div.id = `row-${id}`;
      const titleClass = autoFilled ? 'auto-filled' : (title ? '' : 'needs-fill');
      div.innerHTML = `<div class="pair"><input type="url" value="${escapeAttr(url)}" class="url-input" readonly /><input type="text" placeholder="Titre à saisir…" value="${escapeAttr(title)}" class="title-input ${titleClass}" /></div><button class="remove-btn" onclick="removeRow(${id})" title="Supprimer">×</button>`;
      document.getElementById('rows').appendChild(div);
      div.querySelector('.title-input').addEventListener('input', function() { this.classList.remove('auto-filled','needs-fill'); });
    }

    function removeRow(id) { const el = document.getElementById(`row-${id}`); if (el) el.remove(); }

    function buildHTML(items) {
      const styleTag = `<style>.dossier-link:hover{text-decoration:underline!important}</style>`;
      const divStyle = "font-family:'Open Sans',sans-serif;font-size:16px;line-height:1.5;color:#000;background:#fff;padding:16px 20px;border-radius:8px;box-shadow:0 4px 12px rgba(13,52,109,0.2);width:100%;box-sizing:border-box;margin:16px 0;";
      const titleHTML = `<div style="font-weight:bold;font-size:18px;margin-bottom:12px;">Notre dossier</div>`;
      const rows = items.map(it => `\n  <div style="margin:6px 0;"><span style="color:#000;">► </span><a href="${it.url}" target="_blank" class="dossier-link" style="color:#0000FF;text-decoration:none;cursor:pointer;">${it.title}</a></div>`).join('');
      return `${styleTag}\n<div style="${divStyle}">${titleHTML}${rows}\n</div>`;
    }

    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const btn = document.getElementById('fetchBtn');
      const status = document.getElementById('status');
      const urls = document.getElementById('urlInput').value.split(/\r?\n/).map(l => l.trim()).filter(l => l.startsWith('http'));
      if (urls.length === 0) { alert("Veuillez coller au moins une URL valide."); return; }
      btn.disabled = true; btn.innerText = "Récupération…";
      document.getElementById('rows').innerHTML = ''; rowCount = 0;
      let found = 0;
      for (let i = 0; i < urls.length; i++) {
        status.textContent = `Lien ${i+1}/${urls.length}…`;
        const title = await fetchTitle(urls[i]);
        if (title) found++;
        addRow(urls[i], title || '', !!title);
      }
      document.getElementById('editorSection').style.display = 'block';
      status.textContent = `${found}/${urls.length} titre(s) récupéré(s) automatiquement.`;
      btn.disabled = false; btn.innerText = "Récupérer les titres";
    });

    document.getElementById('addBtn').addEventListener('click', () => addRow('','',false));

    document.getElementById('genBtn').addEventListener('click', () => {
      const urlInputs = document.querySelectorAll('.url-input');
      const titleInputs = document.querySelectorAll('.title-input');
      const items = [];
      for (let i = 0; i < urlInputs.length; i++) {
        const url = urlInputs[i].value.trim();
        const title = titleInputs[i].value.trim();
        if (url) items.push({ url, title: title || url });
      }
      if (items.length === 0) { alert("Aucun lien valide."); return; }
      generatedHTML = buildHTML(items);
      const out = document.getElementById('outputArea');
      out.innerHTML = generatedHTML; out.style.display = 'block';
      document.getElementById('copyBtn').style.display = 'inline-block';
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(generatedHTML).then(() => {
        const msg = document.getElementById('successMsg');
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 3000);
      });
    });
  </script>
</body>
</html>
