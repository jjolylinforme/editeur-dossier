<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Générateur de bloc dossier - GitHub Pages</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Open Sans',sans-serif;background:#f4f6fb;margin:0;padding:28px;color:#0b1a2b}
    .wrap{max-width:800px;margin:0 auto}
    h1{font-size:20px;margin-bottom:16px}
    textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-bottom:10px;box-sizing: border-box;}
    button{background:#0d346d;color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;margin-top:10px;transition: opacity 0.3s;}
    button:disabled{opacity: 0.6; cursor: not-allowed;}
    .output{margin-top:20px;background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
    .loader { font-size: 14px; color: #0d346d; font-style: italic; margin-top: 5px; display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Générateur de bloc HTML</h1>
    
    <p>Collez vos liens ici (un lien par ligne)</p>
    <textarea id="input" rows="8" placeholder="https://www.exemple.fr/article-1"></textarea>
    
    <button id="generateBtn">Générer le bloc HTML</button>
    <div id="loaderStatus" class="loader">Récupération des titres en cours...</div>

    <div class="output" id="outputArea">Le rendu apparaîtra ici...</div>
  </div>

  <script>
    async function fetchMetadata(url) {
      try {
        const response = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
        if (!response.ok) throw new Error('Erreur');
        const data = await response.json();
        return {
          title: data.data.title || url,
          url: url
        };
      } catch (error) {
        return { title: "Lien sans titre", url: url };
      }
    }

    function buildHTML(items) {
      // Configuration en toute largeur (width: 100%) sans max-width
      const divStyle = "font-family: 'Open Sans', sans-serif; font-size: 16px; line-height: 1.5; color: #000; background: #fff; padding: 16px 20px; border-radius: 8px; box-shadow: 0 4px 12px rgba(13,52,109,0.2); width: 100%; box-sizing: border-box; margin: 16px 0;";
      
      const titleHTML = `<div style="font-weight:bold; font-size:18px; margin-bottom:12px;">Notre dossier</div>`;
      
      const rows = items.map(it => `
        <div style="margin:6px 0;">
          <span style="color: #000;">► </span><a href="${it.url}" target="_blank" style="color:#0d346d; text-decoration:none;">${it.title}</a>
        </div>`).join('');

      return `<div style="${divStyle}">${titleHTML}${rows}</div>`;
    }

    document.getElementById('generateBtn').addEventListener('click', async () => {
      const inputArea = document.getElementById('input');
      const btn = document.getElementById('generateBtn');
      const loader = document.getElementById('loaderStatus');
      
      const urls = inputArea.value.split(/\r?\n/).map(l => l.trim()).filter(l => l.startsWith('http'));

      if (urls.length === 0) {
        alert("Veuillez coller au moins une URL valide.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Traitement...";
      loader.style.display = "block";

      const results = [];
      for (const url of urls) {
        const metadata = await fetchMetadata(url);
        results.push(metadata);
      }

      const finalHTML = buildHTML(results);
      document.getElementById('outputArea').innerHTML = finalHTML;

      navigator.clipboard.writeText(finalHTML).then(() => {
        alert('Bloc HTML copié !');
      });

      btn.disabled = false;
      btn.innerText = "Générer le bloc HTML";
      loader.style.display = "none";
    });
  </script>
</body>
</html>
