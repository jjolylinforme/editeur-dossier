<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Générateur de bloc dossier</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Open Sans',sans-serif;background:#f4f6fb;margin:0;padding:28px;color:#0b1a2b}
    .wrap{max-width:800px;margin:0 auto}
    h1{font-size:20px;margin-bottom:16px}
    textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-bottom:10px;box-sizing: border-box; font-family: inherit; font-size: 14px;}
    button{background:#0d346d;color:#fff;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;margin-top:10px;font-weight: 600;}
    button:disabled{opacity: 0.6; cursor: not-allowed;}
    .output{margin-top:20px;background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    .loader { font-size: 14px; color: #0d346d; font-style: italic; margin-top: 5px; display: none; }
    pre { background: #f8f8f8; padding: 15px; border-radius: 5px; border: 1px solid #ddd; overflow-x: auto; font-size: 11px; white-space: pre-wrap; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Générateur de bloc HTML 2.0</h1>
    <p>Collez vos liens ici (un par ligne) :</p>
    <textarea id="input" rows="8" placeholder="https://..."></textarea>
    <button id="generateBtn">Générer le bloc</button>
    <div id="loaderStatus" class="loader">Analyse des liens en cours...</div>

    <div id="resultContainer" style="display:none;">
      <div class="output" id="outputPreview"></div>
      <p style="margin-top:20px;"><strong>Code HTML à copier :</strong></p>
      <pre id="outputCode"></pre>
    </div>
  </div>

  <script>
    // Nettoyage de l'URL pour créer un titre "lisible" par défaut
    function cleanUrlAsTitle(url) {
      try {
        const urlObj = new URL(url);
        let title = urlObj.pathname.split('/').filter(Boolean).pop() || urlObj.hostname;
        title = title.replace(/-/g, ' ').replace(/_/g, ' ').replace(/\.html?$/i, '');
        return title.charAt(0).toUpperCase() + title.slice(1);
      } catch(e) { return url; }
    }

    async function fetchMetadata(url) {
      try {
        // On utilise AllOrigins pour contourner les blocages CORS
        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        if (!response.ok) throw new Error();
        const data = await response.json();
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');
        
        // Liste de recherche par priorité
        const extractedTitle = 
          doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || 
          doc.querySelector('meta[name="twitter:title"]')?.getAttribute('content') ||
          doc.querySelector('meta[name="title"]')?.getAttribute('content') ||
          doc.querySelector('title')?.innerText;

        if (extractedTitle && extractedTitle.trim().length > 3) {
          return { title: extractedTitle.trim(), url: url };
        }
        throw new Error("Pas de titre trouvé");

      } catch (error) {
        // En cas d'échec, on demande à l'utilisateur pour être sûr d'avoir un bon résultat
        const fallback = cleanUrlAsTitle(url);
        const manualTitle = prompt(`Le titre automatique a échoué pour :\n${url}\n\nQuel titre voulez-vous afficher ?`, fallback);
        return { title: manualTitle || fallback, url: url };
      }
    }

    function buildHTML(items) {
      const styleTag = `<style>.dossier-link:hover { text-decoration: underline !important; }</style>`;
      const divStyle = "font-family: 'Open Sans', sans-serif; font-size: 16px; line-height: 1.5; color: #000; background: #fff; padding: 16px 20px; border-radius: 8px; box-shadow: 0 4px 12px rgba(13,52,109,0.2); width: 100%; box-sizing: border-box; margin: 16px 0;";
      
      const rows = items.map(it => `
        <div style="margin:6px 0;">
          <span style="color: #000;">► </span>
          <a href="${it.url}" target="_blank" class="dossier-link" style="color:#0000FF; text-decoration:none;">${it.title}</a>
        </div>`).join('');

      return `${styleTag}<div style="${divStyle}"><div style="font-weight:bold; font-size:18px; margin-bottom:12px;">Notre dossier</div>${rows}</div>`;
    }

    document.getElementById('generateBtn').addEventListener('click', async () => {
      const inputArea = document.getElementById('input');
      const btn = document.getElementById('generateBtn');
      const loader = document.getElementById('loaderStatus');
      const resultContainer = document.getElementById('resultContainer');
      
      const urls = inputArea.value.split(/\r?\n/).map(l => l.trim()).filter(l => l.startsWith('http'));
      if (urls.length === 0) return alert("Veuillez entrer des liens valides");

      btn.disabled = true;
      loader.style.display = "block";
      resultContainer.style.display = "none";

      const results = [];
      for (const url of urls) {
        results.push(await fetchMetadata(url));
      }

      const finalHTML = buildHTML(results);
      document.getElementById('outputPreview').innerHTML = finalHTML;
      document.getElementById('outputCode').innerText = finalHTML;
      
      loader.style.display = "none";
      resultContainer.style.display = "block";
      btn.disabled = false;

      // Copie auto
      navigator.clipboard.writeText(finalHTML);
      alert("Bloc généré ! Le code est copié dans le presse-papier.");
    });
  </script>
</body>
</html>
